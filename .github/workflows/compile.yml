name: Xcode Project + IPA

on:
  push:
    branches: [ "legacy" ]
    paths-ignore: [ "Saturn.xcodeproj/**" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the generated project back

jobs:
  macos:
    name: macOS (Xcode, generate, commit, build IPA)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    # ---- 0. Pick the newest Xcode installed on the runner ----
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode and SDKs
      run: |
        xcodebuild -version
        xcodebuild -showsdks
        xcrun --sdk iphoneos --show-sdk-path

    - name: Fetch Dependencies
      run: brew install cmake sdl2 glew jsoncpp curl pkg-config zsign

    # ---- 1. Execute Asset Processing Script ----
    - name: Run Extract Assets Script
      run: |
        if [ -f "extract_assets.py" ]; then
          python3 extract_assets.py
        else
          echo "extract_assets.py not found in root workspace directory!"
        fi

    # ---- 2. Install Corporate Signing Credentials ----
    - name: Install Rakuten Enterprise Certificate
      env:
        P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
      run: |
        # Decode the certificate back to binary data
        echo "$P12_BASE64" | base64 --decode > build/certificate.p12
        
        # Read the raw provisioning profile template from workspace context
        # (This writes the embedded file using your provided profile plist structure)
        cat << 'EOF' > build/profile.mobileprovision
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
        	<key>AppIDName</key>
        	<string>iSpeed WidgetApp Dev</string>
        	<key>ApplicationIdentifierPrefix</key>
        	<array>
        	<string>HWK767YYMF</string>
        	</array>
        	<key>ProvisionsAllDevices</key>
        	<true/>
        	<key>TeamIdentifier</key>
        	<array>
        		<string>HWK767YYMF</string>
        	</array>
        	<key>TeamName</key>
        	<string>RAKUTEN SECURITIES,INC.</string>
        </dict>
        </plist>
        EOF

    # ---- 3. Compile the Application Structure ----
    - name: Compile App Binary
      run: |
        # Insert your project's native build step commands here (e.g., cmake / xcodebuild)
        mkdir -p build/Payload
        # Placeholder structuring matching your deployment configuration framework:
        # xcodebuild -project Saturn.xcodeproj -scheme Saturn -sdk iphoneos -configuration Release OBJROOT=build SYMROOT=build
        # cp -r build/Release-iphoneos/Saturn.app build/Payload/

    # ---- 4. Cryptographic Sign & Build Over-the-Air Delivery Link ----
    - name: Sign IPA with Enterprise Profile
      env:
        P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
      run: |
        # Compile app structures into an unsigned raw package archive
        cd build
        zip -r unsigned.ipa Payload
        
        # Use zsign engine to rewrite entitlements and sign binary trees globally
        zsign -k certificate.p12 -p "$P12_PASSWORD" -m profile.mobileprovision -o distribution.ipa unsigned.ipa
        
        # Generate the dynamic Over-The-Air iOS installation delivery profile manifest
        cat << 'EOF' > manifest.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>items</key>
            <array>
                <dict>
                    <key>assets</key>
                    <array>
                        <dict>
                            <key>kind</key>
                            <string>software-package</string>
                            <key>url</key>
                            <string>https://palera.in</string>
                        </dict>
                    </array>
                    <key>metadata</key>
                    <dict>
                        <key>bundle-identifier</key>
                        <string>HWK767YYMF.jp.co.rakuten-sec.iSPEED</string>
                        <key>bundle-version</key>
                        <string>1.0.0</string>
                        <key>kind</key>
                        <string>software</string>
                        <key>title</key>
                        <string>AppStoreProject</string>
                    </dict>
                </dict>
            </array>
        </dict>
        </plist>
        EOF

    # ---- 5. Retain Output Packages as GitHub Artifact Build Elements ----
    - name: Archive Production Deployment Assets
      uses: actions/artifacts@v4
      with:
        name: Signed-Enterprise-IPA
        path: |
          build/distribution.ipa
          build/manifest.plist
